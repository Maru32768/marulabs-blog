name: CI

on:
  pull_request:
  push:
    branches: [main]

# No job here can read the private knowledge repository: it is never checked out and
# no token for it exists in this repository. Every build uses this repository alone.
# Tools come from .mise.toml and mise.lock. The `ops` mise profile is never selected here.
permissions:
  contents: read

env:
  # Tool versions and checksums must come from mise.lock.
  MISE_LOCKED: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, test, build and verify the boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # verify-source scans the whole history
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.0
      - run: npm ci
      - name: Scan the repository and its history
        run: npm run verify:source -- --history
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Build the production site and search index
        run: npm run build
      - name: Verify the build contains exactly the published articles
        run: npm run verify:dist
      - name: Keep the verified build for deployment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          retention-days: 7

  e2e:
    name: Browser tests on a fixture build
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.65.0-noble
    env:
      PW_CONTAINER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.0
      - run: npm ci
      - name: Build fixtures with a canary outside the content collection
        run: npm run build:fixtures
      - name: Verify the fixture build and that the canary did not leak
        run: npm run verify:dist -- --dir dist-fixtures --content tests/fixtures/articles
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  terraform:
    name: Validate Terraform
    runs-on: ubuntu-24.04
    # Static checks only. Plan and apply need state and an API token, and their output
    # would be public on this repository, so they run on the operator's machine.
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.0
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  preview:
    name: Deploy a preview
    needs: [verify, e2e]
    # Pull requests from forks get no secrets, so they get no preview either.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    environment: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.0
      - run: npm ci
      # The artifact that passed the boundary check is what gets uploaded, not a new build.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      - run: npm run verify:dist
      - name: Upload a version without promoting it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALIAS: pr-${{ github.event.pull_request.number }}
        run: npx wrangler versions upload --preview-alias "$ALIAS" --message "$ALIAS" | tee "$RUNNER_TEMP/upload.log"
      - name: Show the preview URL
        run: |
          grep -Eo 'https://[^ ]+workers\.dev' "$RUNNER_TEMP/upload.log" | sed 's/^/Preview: /' >> "$GITHUB_STEP_SUMMARY" || true

  deploy:
    name: Deploy to production
    needs: [verify, e2e, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.0
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      - run: npm run verify:dist
      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy the Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Smoke test production
        run: node scripts/smoke-test.ts https://blog.marulabs.dev
